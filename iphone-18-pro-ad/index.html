<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone 18 Pro Film</title>
  <meta name="description" content="A 48-second real-time 3D product film for iPhone 18 Pro. Concept work, not affiliated with Apple Inc.">
  <link rel="preload" href="assets/fonts/InterVariable-opsz.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "InterAd";
      src: url("assets/fonts/InterVariable-opsz.woff2") format("woff2");
      font-weight: 100 900;
      font-display: block;
    }
    :root {
      --bg: #000;
      --fg: #f5f5f7;
      --muted: #86868b;
      --font: "SF Pro Display", "SF Pro", -apple-system, BlinkMacSystemFont, "InterAd", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }
    body { display: grid; place-items: center; }
    #stage { position: relative; background: #000; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    #play {
      position: absolute; inset: 0; margin: auto; width: 88px; height: 88px; border-radius: 50%;
      border: 0; cursor: pointer; background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
      display: grid; place-items: center; transition: transform .25s ease, background .25s ease, opacity .4s ease;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }
    #play:hover { transform: scale(1.06); background: rgba(255, 255, 255, 0.2); }
    #play svg { width: 30px; height: 30px; margin-left: 5px; fill: #fff; }
    #play span { position: absolute; top: calc(100% + 16px); white-space: nowrap; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; color: rgba(255,255,255,.75); }
    body.started #play { opacity: 0; pointer-events: none; }

    #bar {
      position: absolute; left: 16px; right: 16px; bottom: 16px; height: 44px; padding: 0 14px;
      display: flex; align-items: center; gap: 12px; border-radius: 22px;
      background: rgba(30, 30, 32, 0.55); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
      opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s ease;
    }
    body.started.active #bar, body.started #bar:hover, body.started #bar:focus-within { opacity: 1; transform: none; }
    #bar button { all: unset; cursor: pointer; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; }
    #bar button:focus-visible { outline: 2px solid #2997ff; }
    #bar svg { width: 18px; height: 18px; fill: #fff; }
    #toggle[data-state="playing"] .i-play, #toggle[data-state="paused"] .i-pause { display: none; }
    #mute[data-state="muted"] .i-on, #mute:not([data-state="muted"]) .i-off { display: none; }
    #scrub { flex: 1; height: 28px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
    #track { position: relative; width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); overflow: hidden; }
    #fill { position: absolute; inset: 0; background: #fff; transform-origin: left; transform: scaleX(0); }
    #time { font-size: 12px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.7); min-width: 74px; text-align: right; }

    body.capture #play, body.capture #bar { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="type"></canvas>
    <button id="play" aria-label="Play film">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.6v14.8c0 .8.9 1.3 1.6.9l12-7.4c.6-.4.6-1.3 0-1.7l-12-7.4C7.9 3.3 7 3.8 7 4.6z"/></svg>
      <span>Watch the film</span>
    </button>
    <div id="bar">
      <button id="toggle" data-state="paused" aria-label="Play or pause">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.6v14.8c0 .8.9 1.3 1.6.9l12-7.4c.6-.4.6-1.3 0-1.7l-12-7.4C7.9 3.3 7 3.8 7 4.6z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.2" height="16" rx="1.2"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.2"/></svg>
      </button>
      <div id="scrub" role="slider" aria-label="Seek"><div id="track"><div id="fill"></div></div></div>
      <span id="time">0:00 / 0:48</span>
      <button id="mute" data-state="on" aria-label="Mute">
        <svg class="i-on" viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        <svg class="i-off" viewBox="0 0 24 24"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="full" aria-label="Full screen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <audio id="score" src="assets/audio/score.mp3" preload="auto"></audio>
  <script type="module" src="js/film.js"></script>
</body>
</html>
