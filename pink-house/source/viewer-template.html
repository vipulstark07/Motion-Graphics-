<!doctype html>
<!--
  Pink Residence: standalone 3D viewer, a single self-contained file.
  The 3D model (.glb) is embedded below, so this file works on its own.
  three.js loads from the jsDelivr CDN.

  Use it in a website:
    • as an <iframe src="pink-house.html"> (add ?transparent to hide the preview gradient), or
    • copy the <script type="module"> into a page and point it at your own <canvas>.

  URL options:  ?transparent   → no background (the house floats on your page)
                ?static        → no motion
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pink Residence 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(60% 70% at 6% 70%, rgba(255, 47, 168, 0.9), transparent 70%),
        radial-gradient(55% 70% at 98% 55%, rgba(18, 228, 214, 0.9), transparent 70%),
        linear-gradient(100deg, #ff5cc4 0%, #f9c3e9 34%, #eef0fb 52%, #b7f3ee 72%, #29e2d6 100%);
    }
    body.transparent { background: transparent; }
    canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="pink-house" aria-label="3D model of a modern residence with pink LED lighting" role="img"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const GLB_BASE64 = '__GLB_BASE64__';
    const PINK_WASH_LIGHTS = __PINK_WASH_LIGHTS__;

    const params = new URLSearchParams(location.search);
    if (params.has('transparent')) document.body.classList.add('transparent');
    const still = params.has('static') || matchMedia('(prefers-reduced-motion: reduce)').matches;

    const canvas = document.getElementById('pink-house');
    const small = () => Math.min(innerWidth, innerHeight) < 700;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);

    // ---- lights: soft pink ambience, white key with soft shadow, cyan rim ----
    scene.add(new THREE.HemisphereLight('#fff0f8', '#ff7fcf', 0.65));
    const key = new THREE.DirectionalLight('#fff1f8', 1.25);
    key.position.set(6, 16, 10);
    key.castShadow = true;
    key.shadow.mapSize.set(small() ? 1024 : 2048, small() ? 1024 : 2048);
    Object.assign(key.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
    key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.radius = 6;
    scene.add(key);
    const rim = new THREE.DirectionalLight('#5fe6dc', 1.1);
    rim.position.set(14, 5, -8);
    scene.add(rim);

    // ---- turntable rig: float + sway + mouse parallax ----
    const rig = new THREE.Group();
    scene.add(rig);

    const bytes = Uint8Array.from(atob(GLB_BASE64), (c) => c.charCodeAt(0));
    const gltf = await new GLTFLoader().parseAsync(bytes.buffer, '');
    const model = gltf.scene;

    // centre the model on the rig pivot
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    model.position.x -= center.x;
    model.position.z -= center.z;
    rig.add(model);

    model.traverse((o) => {
      if (!o.isMesh) return;
      const isLED = o.name.startsWith('LED');
      o.castShadow = !isLED && o.material.name !== 'ClearGlass';
      o.receiveShadow = !isLED;
    });

    // pink wash lights (positions from the Spline scene)
    for (const [x, y, z] of PINK_WASH_LIGHTS) {
      const l = new THREE.PointLight('#ff3fbf', 110, 16, 2);
      l.position.set(x - center.x, y, z - center.z);
      model.parent.add(l);
    }

    // ---- neon glow halos around every LED strip ----
    const glowTex = (() => {
      const c = document.createElement('canvas'); c.width = 16; c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 128);
      [[0, 0], [0.3, 0.16], [0.45, 0.7], [0.5, 1], [0.55, 0.7], [0.7, 0.16], [1, 0]]
        .forEach(([s, a]) => g.addColorStop(s, `rgba(255,255,255,${a})`));
      ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 128);
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
    })();
    const haloMat = new THREE.MeshBasicMaterial({
      map: glowTex, color: '#ff3fc0', transparent: true, opacity: 0.9,
      depthWrite: false, toneMapped: false, side: THREE.DoubleSide,
    });
    const coreMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffd6f1').multiplyScalar(1.3), toneMapped: false });
    model.updateMatrixWorld(true);
    model.traverse((o) => {
      if (!o.isMesh || !o.name.startsWith('LED')) return;
      o.material = coreMat;
      const b = new THREE.Box3().setFromObject(o);
      const s = b.getSize(new THREE.Vector3());
      const c = b.getCenter(new THREE.Vector3());
      const alongX = s.x > s.z;
      const len = alongX ? s.x : s.z;
      const outward = alongX ? new THREE.Vector3(0, 0, Math.sign(c.z) || 1) : new THREE.Vector3(Math.sign(c.x) || 1, 0, 0);
      const h = o.name === 'LED_Pool_Edge' ? 0.3 : 0.75;
      // vertical halo facing outward
      const out = new THREE.Mesh(new THREE.PlaneGeometry(len + h * 0.5, h * 0.8), haloMat);
      out.position.copy(c).addScaledVector(outward, 0.04);
      if (!alongX) out.rotation.y = Math.PI / 2;
      // horizontal halo washing the underside
      const down = new THREE.Mesh(new THREE.PlaneGeometry(len + h * 0.5, h), haloMat);
      down.position.copy(c); down.position.y -= 0.03;
      down.rotation.x = Math.PI / 2;
      if (!alongX) down.rotation.z = Math.PI / 2;
      for (const m of [out, down]) { m.renderOrder = 5; rig.worldToLocal(m.position); rig.add(m); }
    });

    // soft floating shadow below the model
    const catcher = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
      new THREE.ShadowMaterial({ color: '#5a1d4c', opacity: 0.13, depthWrite: false }));
    catcher.rotation.x = -Math.PI / 2;
    catcher.position.y = -1.6;
    catcher.receiveShadow = true;
    scene.add(catcher);

    // ---- framing: whole house with breathing room, front-right three-quarter view ----
    const radius = size.length() / 2;
    const target = new THREE.Vector3(0, size.y * 0.42, 0);
    const view = { az: 35, el: 18, dist: 30 };
    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, small() ? 1.5 : 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const vf = THREE.MathUtils.degToRad(camera.fov);
      const hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
      view.dist = Math.max((radius * 0.95) / Math.tan(vf / 2), (radius * 1.1) / Math.tan(hf / 2));
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(canvas);
    resize();

    const pointer = { tx: 0, ty: 0, x: 0, y: 0 };
    addEventListener('pointermove', (e) => {
      pointer.tx = (e.clientX / innerWidth) * 2 - 1;
      pointer.ty = (e.clientY / innerHeight) * 2 - 1;
    }, { passive: true });
    document.addEventListener('pointerleave', () => { pointer.tx = 0; pointer.ty = 0; });

    const clock = new THREE.Clock();
    const amp = still ? 0 : 1;
    let visible = true;
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(canvas);

    renderer.setAnimationLoop(() => {
      if (!visible || document.hidden) return;
      const dt = Math.min(0.05, clock.getDelta());
      const t = clock.elapsedTime;
      const k = 1 - Math.exp(-dt * 2.6);
      pointer.x += (pointer.tx - pointer.x) * k;
      pointer.y += (pointer.ty - pointer.y) * k;
      const intro = still ? 1 : 1 - Math.pow(1 - Math.min(1, t / 2.4), 3);
      const idle = still ? 0 : Math.min(1, Math.max(0, (t - 1.4) / 2.5));

      rig.rotation.y = THREE.MathUtils.degToRad((1 - intro) * -16 + Math.sin(t * Math.PI * 2 / 26) * 10 * idle * amp + pointer.x * 6 * amp);
      rig.position.y = -(1 - intro) * 0.8 + Math.sin(t * Math.PI * 2 / 7) * 0.12 * idle * amp;
      haloMat.opacity = 0.9 * (1 + Math.sin(t * Math.PI * 2 / 5.5) * 0.07 * amp);

      const az = THREE.MathUtils.degToRad(view.az + pointer.x * 3 * amp);
      const el = THREE.MathUtils.degToRad(view.el - pointer.y * 2.5 * amp);
      camera.position.set(
        target.x + Math.sin(az) * Math.cos(el) * view.dist,
        target.y + Math.sin(el) * view.dist,
        target.z + Math.cos(az) * Math.cos(el) * view.dist);
      camera.lookAt(target);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
